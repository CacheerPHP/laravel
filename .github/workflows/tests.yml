name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
        laravel: ['12', '13']
        include:
          - laravel: '12'
            testbench: '^10.0'
          - laravel: '13'
            testbench: '^11.0'

    services:
      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      CACHEER_TEST_REDIS_PORT: 6379

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: redis, pdo_sqlite
          coverage: none

      - name: Install dependencies
        run: >-
          composer update --with-all-dependencies --no-interaction --no-progress
          --with "laravel/framework:^${{ matrix.laravel }}.0"
          --with "orchestra/testbench:${{ matrix.testbench }}"

      - name: Tests (predis)
        run: vendor/bin/phpunit

      - name: Redis tests (phpredis)
        run: vendor/bin/phpunit --filter redis
        env:
          CACHEER_TEST_REDIS_CLIENT: phpredis

  quality:
    name: Lint, types, refactoring
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: redis
          coverage: none

      - run: composer update --no-interaction --no-progress

      - run: vendor/bin/pint --test
      - run: vendor/bin/phpstan analyse --no-progress
      - run: vendor/bin/rector process --dry-run

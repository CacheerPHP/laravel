name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }} / core ${{ matrix.core }} / ${{ matrix.dependencies }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
        laravel: ['12', '13']
        core: ['^6.0']
        dependencies: ['highest']
        include:
          - laravel: '12'
            testbench: '^10.0'
          - laravel: '13'
            testbench: '^11.0'
          - php: '8.3'
            laravel: '12'
            testbench: '^10.0'
            core: '6.0.*'
            dependencies: 'lowest'
          - php: '8.3'
            laravel: '13'
            testbench: '^11.0'
            core: '6.0.*'
            dependencies: 'lowest'
          - php: '8.5'
            laravel: '13'
            testbench: '^11.0'
            core: '6.0.*'
            dependencies: 'highest'

    services:
      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      CACHEER_TEST_REDIS_PORT: 6379

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: redis, pdo_sqlite
          coverage: none

      - name: Install dependencies
        run: >-
          composer update --with-all-dependencies --no-interaction --no-progress
          --with "laravel/framework:^${{ matrix.laravel }}.0"
          --with "orchestra/testbench:${{ matrix.testbench }}"
          --with "silviooosilva/cacheer-php:${{ matrix.core }}"
          ${{ matrix.dependencies == 'lowest' && '--prefer-lowest --prefer-stable' || '' }}

      - name: Tests (predis)
        run: vendor/bin/phpunit

      - name: Tests (phpredis)
        run: vendor/bin/phpunit
        env:
          CACHEER_TEST_REDIS_CLIENT: phpredis

  quality:
    name: Lint, types, refactoring
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: redis
          coverage: none

      - run: composer update --no-interaction --no-progress

      - run: composer validate --strict

      - run: vendor/bin/pint --test
      - run: vendor/bin/phpstan analyse --no-progress
      - run: vendor/bin/rector process --dry-run

  consumer:
    name: Clean Laravel ${{ matrix.laravel }} consumer
    runs-on: ubuntu-latest
    strategy:
      matrix:
        laravel: ['12', '13']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite
          coverage: none

      - name: Set smoke test paths
        run: |
          echo "SMOKE_APP=$RUNNER_TEMP/cacheer-consumer" >> "$GITHUB_ENV"
          echo "SMOKE_ARCHIVE=$RUNNER_TEMP/cacheer-laravel.zip" >> "$GITHUB_ENV"

      - name: Install the distribution without development dependencies
        run: |
          composer archive --format=zip --dir="$RUNNER_TEMP" --file=cacheer-laravel
          composer create-project "laravel/laravel:^${{ matrix.laravel }}.0" "$SMOKE_APP" --no-install --no-scripts --no-interaction --no-progress
          php tests/prepare-smoke.php "$SMOKE_APP" "$SMOKE_ARCHIVE"
          composer install --working-dir="$SMOKE_APP" --no-dev --no-interaction --no-progress

      - name: File backend with cached configuration
        run: |
          php "$SMOKE_APP/artisan" config:cache
          php tests/smoke.php "$SMOKE_APP"

      - name: Published database migration and database backend
        env:
          CACHEER_SMOKE_BACKEND: database
        run: |
          php "$SMOKE_APP/artisan" config:cache
          php "$SMOKE_APP/artisan" vendor:publish --tag=cacheer-migrations --force
          php "$SMOKE_APP/artisan" migrate --force
          php tests/smoke.php "$SMOKE_APP"
